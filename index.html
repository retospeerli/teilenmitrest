<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teilen mit Rest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">

    <!-- Menü -->
    <section id="menuCard" class="card">
        <h1>Teilen mit Rest</h1>
        <p class="subtitle">Wähle deine Stufe</p>

        <button id="grade3Btn">
            3. Klasse<br>
            <span>Einmaleins 2–10 · Faktor bis 12</span>
        </button>

        <button id="grade4Btn">
            4. Klasse<br>
            <span>Einmaleins 2–10 · Faktor bis 20</span>
        </button>
    </section>

    <!-- Spiel -->
    <section id="gameCard" class="card" hidden>

        <h1>Teilen mit Rest</h1>
        <p id="levelText" class="subtitle"></p>

        <div class="stats">
            <div>Richtig: <span id="correctCount">0</span> / 15</div>
            <div>Versuche: <span id="tryCount">0</span></div>
        </div>

        <div id="task" class="task"></div>

        <form id="answerForm">
            <label>
                Antwort:
                <input id="answerInput" type="text" autocomplete="off" required>
            </label>

            <button type="submit">Prüfen</button>
        </form>

        <div id="feedback" class="feedback"></div>

        <button id="nextBtn" hidden>Nächste Aufgabe</button>
        <button id="menuBtn">Zurück zum Menü</button>
        <button id="restartBtn" hidden>Neu starten</button>

    </section>

</main>

<script src="app.js"></script>
</body>
</html>
