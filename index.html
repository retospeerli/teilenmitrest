<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teilen mit Rest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">

    <section class="card">

        <h1>Teilen mit Rest</h1>
        <p class="subtitle">Löse 15 Aufgaben richtig.</p>

        <div class="stats">
            <div>Richtig: <span id="correctCount">0</span> / 15</div>
            <div>Versuche: <span id="tryCount">0</span></div>
        </div>

        <div id="task" class="task"></div>

        <form id="answerForm">

            <label>
                Antwort:
                <input
                    id="answerInput"
                    type="text"
                    autocomplete="off"
                    spellcheck="false"
                    required
                >
            </label>

            <button type="submit">
                Prüfen
            </button>

        </form>

        <div id="feedback" class="feedback"></div>

        <button id="nextBtn" hidden>
            Nächste Aufgabe
        </button>

        <button id="restartBtn" hidden>
            Neu starten
        </button>

    </section>

</main>

<script src="app.js"></script>

</body>
</html>
